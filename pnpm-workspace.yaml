packages:
  - "apps/*"
  - "packages/*"

# ── Transitive dependency overrides ──────────────────────────────────────────
# These pin vulnerable transitive packages to their patched versions.
# Direct upgrades for nodemailer (v6→latest 6.x patch) and uuid (v10→v11)
# are handled in apps/api/package.json.
# next@14.x CVEs cannot be resolved without a breaking Next.js 15 migration.
overrides:
  brace-expansion@>=1.0.0 <1.1.18: ">=1.1.18"
  brace-expansion@>=2.0.0 <2.1.4: ">=2.1.4"
  brace-expansion@>=4.0.0 <5.0.9: ">=5.0.9"
  glob@>=10.2.0 <10.5.0: ">=10.5.0"
  js-yaml@>=3.0.0 <3.15.1: ">=3.15.1"
  js-yaml@>=4.0.0 <4.3.1: ">=4.3.1"
  nanoid@<3.3.17: ">=3.3.17"
  postcss@<8.5.23: ">=8.5.23"
  uuid@<11.1.1: ">=11.1.1"
